<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src blob:; connect-src http://127.0.0.1:*"><title>Jarvis</title></head>
<body><div id="screen">
  <canvas id="sky"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="bg"></canvas>
  <div id="halo" aria-hidden="true"><i></i></div>

    <div class="go-wrap"><button type="button" class="go" id="go"></button><span class="hint" id="go-hint"></span></div>

  <div id="panel" role="dialog" aria-label="Jarvis"><div class="p-in" id="pin"></div></div>

</div><script type="module" src="/src/firstRun/firstRun.ts"></script></body></html>
