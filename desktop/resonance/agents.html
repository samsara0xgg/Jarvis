<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:*; media-src http://127.0.0.1:*; frame-src http://127.0.0.1:*; connect-src http://127.0.0.1:*"><title>Agents</title></head>
<body>
<div class="win booting" id="win">
  <div class="w-bar"><span class="w-title">Agents</span><span class="w-off" hidden>连不上后台，正在重连…</span><button type="button" class="snd" data-act="sound" aria-pressed="true" aria-label="声音"></button></div>
  <p class="w-boot" role="status">正在接上会话…</p>
  <div class="w-body">
    <aside class="side" aria-label="会话">
      <div class="her"><canvas class="her-c" aria-label="Jarvis，点她去下一个等你的会话" role="button" data-tip="去下一个轮到你的"></canvas><button type="button" class="her-t" data-act="next"></button></div>
      <div class="s-top">
        <div class="s-row">
          <button type="button" class="new" data-act="new" data-tip="新会话" data-key="⌘N">新会话</button>
          <label class="find"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.3"/><path d="m10.3 10.3 3.2 3.2"/></svg><input id="find" placeholder="搜索" autocomplete="off" aria-label="搜索会话"><kbd>⌘K</kbd></label>
        </div>
        <div class="s-opts">
          <span class="seg"><button type="button" data-act="filter" data-v="all">全部</button><button type="button" data-act="filter" data-v="claude">Claude</button><button type="button" data-act="filter" data-v="codex">Codex</button></span>
          <button type="button" class="by" data-act="by" data-tip="按状态或按项目分组"></button>
        </div>
      </div>
      <div class="s-list"></div>
      <p class="empty" hidden></p>
      <button type="button" class="arch-link" data-act="archview"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v3h-11zM3.5 6.5v6h9v-6M6.5 9h3"/></svg>已归档<em></em></button>
    </aside>
    <main class="main">
      <header class="m-head">
        <button type="button" class="side-btn" data-act="side" aria-label="会话列表"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg></button>
        <span class="h-mk"></span>
        <div class="h-main"><div class="h-t"></div><div class="h-meta"></div></div>
        <button type="button" class="h-btn" data-act="terminal"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="M4.5 6.5 6.5 8l-2 1.5M8 10h3.5"/></svg><span>在终端打开</span></button>
        <button type="button" class="h-btn icon" data-act="menu" data-v="more" aria-label="更多" data-tip="置顶、分叉、归档、停掉"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
      </header>
      <div class="bd">
        <nav class="pn lp off" aria-label="落地">
          <div class="lp-w"><div class="lp-h"><div><h4>落地</h4><button type="button" class="ib" data-act="lpclose" aria-label="收起落地面板" data-tip="收起"></button></div><span class="br"></span></div><ol class="pl"></ol><div class="lp-f"></div></div>
          <div class="rail"></div>
        </nav>
        <section class="pn chat" aria-label="对话">
          <div class="host"></div>
          <div class="composer">
            <div class="c-menu"></div>
            <div class="c-rows"></div>
            <div class="c-box">
              <div class="bn" hidden></div>
              <div class="c-files"></div>
              <div class="tw"><textarea id="msg" rows="1" aria-label="消息"></textarea><div class="hint"></div></div>
              <div class="c-tools"><div class="t-l"></div><span class="gap"></span><button type="button" class="land" data-act="landpanel" data-tip="打开落地面板" hidden></button><div class="t-r"></div></div>
            </div>
            <input type="file" id="file" accept="image/*" multiple hidden>
          </div>
        </section>
        <section class="pn sheet pv off" aria-label="预览">
          <div class="sh"><button type="button" class="ib pvb" data-act="pvback" aria-label="返回" data-tip="返回" hidden></button><span class="ic"></span><b></b><small></small><button type="button" class="ib" data-act="pvflip"></button><button type="button" class="ib" data-act="pvext" aria-label="在新窗口打开" data-tip="在新窗口打开"></button><button type="button" class="ib" data-act="pvclose" aria-label="关闭预览" data-tip="关掉" data-key="←"></button></div>
          <div class="pv-body"><div class="pv-view"></div></div>
        </section>
        <section class="pn tm off" aria-label="终端"></section>
      </div>
    </main>
  </div>
  <div class="pop" role="menu"></div>
  <div class="tip" aria-hidden="true"></div>
  <div class="toast" role="status" hidden></div>
</div>
<script type="module" src="/src/agents/page.ts"></script>
</body></html>
