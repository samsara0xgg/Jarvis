<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Jarvis in a browser tab: the app's glass icon (ios/Jarvis/Resources/Assets.xcassets/AppIcon) drawn for 16 px, with
     the eyes a little bolder. Her other faces are favicon-blink, -sleep and -glad.svg, swapped in by her-icon.js. -->
  <defs>
    <radialGradient id="halo"><stop offset=".78" stop-color="#7a6af0" stop-opacity=".7"/><stop offset="1" stop-color="#7a6af0" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple" cx="32" cy="41" r="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5b3aae"/><stop offset="1" stop-color="#5b3aae" stop-opacity="0"/></radialGradient>
    <radialGradient id="teal" cx="44" cy="22" r="13" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1d5680" stop-opacity=".9"/><stop offset="1" stop-color="#1d5680" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="14" y1="8" x2="50" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cfc9ff"/><stop offset=".5" stop-color="#5e56a8"/><stop offset="1" stop-color="#8fd0f2"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><feGaussianBlur stdDeviation="1.7"/></filter>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="26.5" fill="#110f28"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#purple)"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#teal)"/>
  <path d="M13.6 22.5A21 21 0 0 1 27.5 10.2" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2" stroke-linecap="round"/>
  <g fill="#fff"><circle cx="45" cy="16.5" r=".55" opacity=".8"/><circle cx="20" cy="44" r=".5" opacity=".6"/><circle cx="41.5" cy="48" r=".6" opacity=".7"/><circle cx="25" cy="17" r=".45" opacity=".6"/></g>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  <rect x="20.20" y="21.50" width="8.40" height="18.20" rx="4.20" transform="rotate(7.7 24.40 30.60)" fill="#c9c3ff" opacity=".9" filter="url(#glow)"/>
  <rect x="20.80" y="22.10" width="7.20" height="17.00" rx="3.60" transform="rotate(7.7 24.40 30.60)" fill="#fff"/>
  <rect x="35.40" y="21.50" width="8.40" height="18.20" rx="4.20" transform="rotate(-7.7 39.60 30.60)" fill="#c9c3ff" opacity=".9" filter="url(#glow)"/>
  <rect x="36.00" y="22.10" width="7.20" height="17.00" rx="3.60" transform="rotate(-7.7 39.60 30.60)" fill="#fff"/>
</svg>
