<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:transparent}</style>
<script src="out/her-main.js"></script>
<script>
// Her as the desktop draws her (starCore + agents/exposure/her.ts), stepped on virtual time so a render is repeatable.
const J = window.JarvisHer;
let seed = 7; // mulberry32: the core picks blink times with Math.random
Math.random = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const copy = c => { const o = document.createElement('canvas'); o.width = c.width; o.height = c.height; o.getContext('2d').drawImage(c, 0, 0); return o; };
// s: {face, R, W, out, look, n, fps, blinkMs}; returns n PNG data URLs (one loop; no cross-fade: blending two poses of her eyes ghosts them).
window.renderLoop = s => {
  const cv = document.createElement('canvas'), h = new J.Her(cv, s.W, s.R, true);
  h.core.motion = J.MOTION_V2; h.core.layers = J.LAYERS_ON;
  h.face = s.face; h.faceUntil = 1e15; h.out = s.out; h.look = s.look;
  h.shine.value = s.out ? 1 : 0; h.sc.value = 1;
  // SUB whole steps per frame, at least 32 steps a second (8 fps: 4 x 1/32 s; 30 fps: 2 x 1/60 s)
  const SUB = Math.ceil(32 / s.fps), DT = 1 / (s.fps * SUB), input = { expr: s.face, look: s.look, still: false, pressed: false };
  let vt = 1000;
  for (let f = 0; f < 3 / DT; f++) { vt += DT * 1000; h.core.update(vt, DT, input); }  // 3 s to settle
  const t0 = vt; h.core.blinkAt = s.blinkMs == null ? 1e15 : t0 + s.blinkMs;
  const frames = [];
  for (let i = 0; i < s.n; i++) {
    for (let k = 0; k < SUB; k++) { vt += DT * 1000; k === SUB - 1 ? h.frame(vt, DT) : h.core.update(vt, DT, input); }
    if (s.blinkMs != null && vt > t0 + s.blinkMs + 50 && h.core.blinkStart < 0) h.core.blinkAt = 1e15; // one blink per loop
    frames.push(copy(cv));
  }
  return frames.map(c => c.toDataURL('image/png'));
};
document.title = 'ready';
</script>
