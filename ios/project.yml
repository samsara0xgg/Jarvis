name: Jarvis
options:
  bundleIdPrefix: com.yilunshi
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3MEBVQ3N3U
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jarvis:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Jarvis]
    dependencies:
      - target: JarvisWidgets
      - target: JarvisShare
    # the brain answers on plain http over the tailnet (docs/spec.html: `brain` in the pairing answer is http://host:port).
    # Local networking covers IP addresses and bare names; MagicDNS names (*.ts.net) need their own exception. Nothing else is opened.
    info:
      path: Jarvis/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSSupportsLiveActivities: true   # her state and the next reminder in the Dynamic Island, updated by the brain's pushes
        UIBackgroundModes: [audio, location, fetch]   # audio: her reply keeps playing if the phone is locked mid-answer; location + fetch: the phone reports what it senses (ADR 0197)
        BGTaskSchedulerPermittedIdentifiers: [com.yilunshi.jarvis.report-flush]
        NSLocationWhenInUseUsageDescription: 记下你去过的地方，让她知道你在哪。
        NSLocationAlwaysAndWhenInUseUsageDescription: 选「始终」，你到了新地方、或走远了，她才收得到，不用你打开 App。平时只记到达和离开，走路、坐车时才记得密一些，不会一直定位。
        NSMotionUsageDescription: 知道你是在走路、骑车还是坐着，她就明白你这一天是怎么过的。
        NSHealthShareUsageDescription: 读取你选的步数、训练或睡眠，只发给你自己的大脑。
        NSFocusStatusUsageDescription: 知道你开了专注模式，她就不会在这时候打扰你。
        CFBundleURLTypes:
          - CFBundleURLName: com.yilunshi.jarvis
            CFBundleURLSchemes: [jarvis]
    # HealthKit and push are capabilities on the App ID (registered through Xcode's automatic signing). HEALTH_ENTITLED below tells the
    # health collector the entitlement is signed in; without both it stays unavailable instead of crashing.
    entitlements:
      path: Config/Jarvis.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: development
        # the pairing is shared with the share extension: the token in this Keychain group (first, so it is where items are written; the app's own group second, so a token
        # saved before the group existed can still be read and moved), the brain's addresses in the App Group's defaults
        keychain-access-groups: ["$(AppIdentifierPrefix)com.yilunshi.jarvis.shared", "$(AppIdentifierPrefix)com.yilunshi.jarvis"]
        com.apple.security.application-groups: [group.com.yilunshi.jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilunshi.jarvis
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jarvis
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: 拍照给 Jarvis 看，或扫大脑上的二维码来配对
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选照片交给 Jarvis 看
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 和 Jarvis 说话时用麦克风
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 在手机上把你的话转成文字
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HEALTH_ENTITLED"
  JarvisWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: JarvisWidgets
        excludes: ["Info.plist"]
      - Jarvis/Voice/TalkIntent.swift       # the control's button names the app's intent
      - Jarvis/Push/JarvisActivity.swift    # the Live Activity's shape, started by the app and drawn here
      - path: Jarvis/Resources/Fonts        # the app's faces, for the Live Activity
        excludes: ["README.md"]
    info:
      path: JarvisWidgets/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UIAppFonts: [InstrumentSerif-Regular.ttf, IBMPlexMono-Regular.ttf, IBMPlexMono-Medium.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilunshi.jarvis.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  JarvisShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: JarvisShare
        excludes: ["Info.plist"]
      - Jarvis/Brain/BrainClient.swift      # the request code and the Keychain wrapper
      - Jarvis/Brain/BrainStore.swift       # the pairing, as the app saved it
    info:
      path: JarvisShare/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:       # one web address, or text; nothing else
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Config/JarvisShare.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.yilunshi.jarvis.shared"]
        com.apple.security.application-groups: [group.com.yilunshi.jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilunshi.jarvis.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  JarvisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - JarvisTests
      - JarvisShare/SharePayload.swift      # the share extension's pure part
    dependencies:
      - target: Jarvis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yilunshi.jarvis.tests
