[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Allen's state-centric personal runtime."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest",
    "import-linter",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
