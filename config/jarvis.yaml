llm:
  # LLM 提供商：openai（兼容 xAI/Kimi/DeepSeek）或 anthropic。
  provider: openai

  # 运行时可切换的模型预设（"小月，快速模式" / "小月，深度模式"）
  default_preset: deep

  presets:
    fast:
      model: gpt-5.4-mini
      base_url: "https://openrouter.icu/v1"
      api_key_env: OPENROUTER_PROXY_KEY
      max_tokens: 2048
    deep:
      model: gpt-5.5
      base_url: "https://openrouter.icu/v1"
      api_key_env: OPENROUTER_PROXY_KEY
      max_tokens: 32768
    # screen_look 专用（ADR-0011 D7）：多模态模型，同一个代理、同一把
    # key。决策 LLM（deep/fast 两档）从不切到这个预设——vision 只在
    # jarvis.runtime 注入的独立 LLMClient 实例上用一次。
    vision:
      model: gpt-5.5
      base_url: "https://openrouter.icu/v1"
      api_key_env: OPENROUTER_PROXY_KEY
      max_tokens: 1024

  # 流式回复的句子切分调优
  sentence_divider:
    # 首句遇逗号即切（更早 ship 给 TTS，首字延迟 -50%~)
    faster_first_response: true
    # 保护英文缩写不在 Dr./e.g./vs. 等处误切
    abbreviation_protect: true

# Supervisor sweep（ADR-0009 D4 / spec §3.4.8）：扫 open actions，超过
# deadline 且无 terminal event 的 emit action.timeout_assumed。
supervisor:
  # 没有 dispatcher 打的 result_expected_by_ms 时用的兜底预算（秒）。
  # 700 = Codex 600s 预算 + 100s grace，与 dispatcher 打的时间戳一致，
  # 所以旧 row 和新 row 同龄时判定超时的时刻完全相同。
  default_budget_s: 700
  # 周期扫描间隔（秒）。Step 7 才把它接到 serve_inherent 的 watcher 列表。
  sweep_interval_s: 30

# Repo observer v0（ADR-0009 D5 / spec §3.6.1）：只读本地 git 轮询，
# 只在快照字段变化时 emit，不触发任何 decide() turn。
observer:
  # 轮询间隔（秒）。同一个数字还决定 Status Board note 的 stale 判定
  # （stale = 3 × poll_interval_s，ADR-0009 D6 v0 / 偏差 V4），所以改这里
  # 就够了——note 的判词跟着一起走，不会和真实轮询节奏脱节。
  poll_interval_s: 60
  # 被观察的 repo（绝对路径，`~` 会展开）。空列表 = 不启动观察器任务。
  # Allen 自己维护这份清单：观察器只读，不 fetch，不写外部世界。
  repos: []

# ADR-0011 D7 — L4 只读工具配置（tools.py 不自己读 YAML，composition
# root 在 build_default_registry() 时把值传进去）。
tools:
  obsidian:
    # search_notes 的搜索根目录，`~` 会展开。Allen 可能改名/迁移 vault，
    # 找不到时 search_notes 返回空结果 + 提示，不是 boot 失败。
    vault_root: "~/Documents/Obsidian Vault"
  web:
    # web_search 在请求未指定 max_results 时的默认值；硬上限 8 写死在
    # tools.py，这里改不了那个上限。
    search_max_results: 5
    # 哪个后端来答 web_search：exa | tavily | ddgs。
    #
    # ddgs（非官方 DuckDuckGo 抓取）是默认值，只因为它不需要凭证——不是
    # 推荐值。它只回链接+摘要，想看正文得再花一轮 web_fetch；而且经常被
    # 反爬挡掉（Te3815a16 那轮 5 次工具调用里有 3 次花在它身上，最后一次
    # 直接 No results found）。
    #
    # 换成 exa 或 tavily（并设好下面的 search_api_key_env），搜索直接带
    # 回页面正文：既有据可依，也省下一整轮工具循环预算。
    search_provider: tavily
    # 上面那个 provider 的 API key 从哪个环境变量读。和 llm.presets.*
    # 的 api_key_env 是同一套间接引用——key 永远不写进这个文件；实际的
    # key 放在 ~/.jarvis/env（0600），因为 launchd 会剥掉 shell 环境。
    #
    # 留空即可：不填就按 provider 自动推导成 EXA_API_KEY / TAVILY_API_KEY。
    # 只有在你想用非常规变量名时才需要显式写，而且写了也必须和 provider
    # 对得上——否则启动时拒用并退回 ddgs，不会把 A 家的 key 发给 B 家。
    #
    # 指定了 exa/tavily 但变量没设：告警 + 退回 ddgs，不会 boot 失败，
    # 且实际用了哪个后端会写进 web_search 结果的 provider 字段。
    search_api_key_env:
    # web_fetch 从 socket 上最多读多少字节响应体。这是内存/DoS 护栏，
    # 不是输出上限——输出上限是下面的 fetch_max_text_bytes。
    #
    # 这两个曾经是同一个键（8192），后果是：真实网页光 <head> 里的内联
    # CSS/JSON-LD/script 就远超 8KB，抓取在碰到正文之前就断了，解析器
    # 拿到的是纯 <head>，抽出来一个字都没有。150KB 的页面只读到 5.4%。
    # 2MiB 足够越过任何正常文档的 head，同时仍然拒绝无限流。
    fetch_max_bytes: 2097152
    # web_fetch 真正的输出上限：HTML 抽完正文之后，最多把多少字节的
    # 文本交给 LLM（超出部分变成 "…[truncated N bytes of extracted text]"）。
    # 卡在抽取后的文本上，这个数字才名副其实——8KB 可读正文，而不是
    # 8KB 可能一个字正文都不含的标记。
    fetch_max_text_bytes: 8192
    # web_search 和 web_fetch 共用同一个超时（秒）。ADR-0011 D5 原文给
    # 两个工具分别写了 15s/20s，但这里只有一个键——D7 定的 schema 就是
    # 一个共享超时，所以两个工具都读这一个值（§12 勘误候选项）。
    timeout_s: 20
  screen:
    # screen_look 用哪个 llm.presets.* 做 vision 调用。
    vision_preset: vision
    # 截图喂给 vision 模型前用 sips 缩到这个宽度以内（像素）。
    max_width_px: 1568

# ADR-0012 §3 D4/V2 — confirm_required 询问（confirmation.requested）
# 的存活时长。默认 10 分钟；live burn 验证 C3（TTL 过期）时把这里改短，
# 不用碰代码。
confirmation:
  ttl_ms: 600000

# ADR-0006/0008 Wave 1 safety primitives.  All adoption switches remain
# disabled: this wave proves transaction/CAS/accounting behavior without
# enabling concurrent turns, model streaming, or streaming TTS/player work.
realtime:
  enabled: false
  concurrency_safety:
    transactional_event_append: false
    lifecycle_terminal_cas: false
    confirmation_dispatch_outbox: false
    exactly_once_cost_accounting: false
  # ADR-0008 Step 2 (Wave 4A).  Enabling response_run_lifecycle additionally
  # requires realtime.enabled plus concurrency_safety.transactional_event_append
  # and .lifecycle_terminal_cas; independent_response_cancel additionally
  # requires response_run_lifecycle.  An invalid combination downgrades once,
  # with one warning, to the complete legacy batch path.  cancel_timeout_ms is
  # the cancel connection's SQLite busy_timeout: it bounds the terminal CAS,
  # never an in-flight provider call.
  response:
    response_run_lifecycle: false
    independent_response_cancel: false
    cancel_timeout_ms: 500
  # ADR-0008 Step 3 (Wave 4B).  action_runner routes ToolRegistry.dispatch
  # through the L4 ActionRunner: the handler runs on the runner's own thread
  # and connection under a resolved resource lease, while the driver still
  # waits for the handle.  It additionally requires realtime.enabled plus the
  # same two concurrency_safety switches as response_run_lifecycle.
  # max_concurrent_runs bounds runner threads AFTER resource leases are
  # respected.  ADR-0008 §6's undeclared_mutation_mode knob is deliberately
  # absent: the resolver implements exactly the fail-closed global_exclusive
  # value, and a knob whose only legal setting is its default is a config lie.
  actions:
    action_runner: false
    # ADR-0008 Step 4 (Wave 5).  true_async_workers stops the driver from
    # awaiting a declared-async tool: `dispatch` returns as soon as the
    # ActionRun is accepted and the runner owns quiescence, verification,
    # stash restore and lease release through its own finalizer.  Requires
    # action_runner, and downgrades once with a warning without it.
    true_async_workers: false
    max_concurrent_runs: 1
    lease_timeout_s: 900
  # ADR-0008 D8 (Wave 5).  intent_pump replaces the daemon's "poll one
  # event, await its whole turn" watcher with a durable-claim queue: each
  # trigger is claimed once by an idempotent turn.started, the cursor
  # advances only after the claim is accepted, and a bounded pool drives
  # the turns.  First activation records one consumer.adopted watermark, so
  # historical utterances are never replayed.  queue_capacity full means
  # backpressure — the watcher leaves the row unconsumed rather than
  # dropping a durable utterance.  ADR-0008 §6 names no key for this block;
  # the shape mirrors realtime.actions.
  input:
    intent_pump: false
    queue_capacity: 8
    max_concurrent_turns: 2
  # Wave 2 rollout.  Enabling this also requires realtime.enabled plus the
  # transactional append and lifecycle terminal CAS switches above.  Invalid
  # combinations downgrade once to the complete legacy batch path.
  streaming_output:
    enabled: false
    canonical_sample_rate_hz: 48000
    command_queue_capacity: 64
    response_lane_capacity: 8
    response_text_bytes: 262144
    session_command_capacity: 2
    session_audio_capacity: 16
    session_idle_close_s: 10.0
    response_timeout_s: 45.0
    ring_retry_s: 0.002
    presentation_poll_s: 0.005
    shutdown_timeout_s: 3.0
    event_drain_batch: 128
    terminal_retry_attempts: 3
    checkpoint_retry_attempts: 3
    durability_retry_s: 0.02
    enable_macos_say_fallback: true
  # ADR-0006 Step 5. Disabled by default. When enabled it additionally
  # requires the Wave-1 transactional/terminal switches above and a live
  # Wave-2 StreamingTTSPipeline; failed validation happens before device open
  # and uses legacy wake. A failed/uncertain device open keeps only text and
  # whole-WAV PTT upload for that boot so no second input owner can appear.
  single_audio_ingress:
    enabled: false
    backend: sounddevice
    canonical_sample_rate_hz: 16000
    canonical_frame_samples: 512
    native_ring_capacity: 128
    default_subscriber_capacity: 64
    max_subscribers: 8
    wake_subscriber_capacity: 64
    capture_subscriber_capacity: 128
    diagnostic_subscriber_capacity: 16
    detection_queue_capacity: 2
    commit_queue_capacity: 2
    wake_failure_threshold: 3
    pre_roll_ms: 500
    min_voiced_s: 1.0
    max_utterance_s: 30.0
    armed_no_speech_timeout_s: 3.0
    worker_poll_s: 0.002
    session_worker_poll_s: 0.005
    fault_poll_s: 0.02
    route_poll_s: 1.0
    reopen_attempts: 3
    reopen_initial_backoff_s: 0.05
    reopen_max_backoff_s: 0.5
    backend_open_timeout_s: 2.0
    backend_close_timeout_s: 2.0
    shutdown_timeout_s: 2.0
    session_shutdown_timeout_s: 3.0
