# jarvis.yaml — runtime configuration.
#
# Per-environment overrides may be merged from ~/.config/jarvis/local.yaml
# (mechanism TBD; M2 will land the loader).
#
# Secrets (API keys) live in env vars — never commit them here.
#   MINIMAX_API_KEY            primary TTS
#   MINIMAX_API_KEY_FALLBACK   secondary TTS endpoint
#   OPENAI_API_KEY             Tier 2 LLM (or provider-specific)

paths:
  # Model files live OUTSIDE the repo. Symlinks in legacy data/ point here.
  models: ~/Models
  vault: ~/Documents/Obsidian Vault/jarvis
  event_log: var/mac_events.db
  artifact_store: var/artifacts
  logs: var/logs

domain:
  current: mac
  mac:
    sleep_wake_hooks: enabled
    # Mandatory reconciliation scan on wake closes orphan
    # dispatched / running actions that crossed the sleep window.
    reconciliation_on_wake: true

voice:
  enabled: true

  asr:
    primary: sensevoice
    model_path: ${paths.models}/sensevoice-small-int8
    fallback: whisper
    fallback_model: small

  vad:
    provider: silero
    threshold: 0.5

  wake:
    enabled: true
    model: hey_jarvis_v0.1

  # Pre-emit canonicalisation applied inside Voice adapter before emitting
  # utterance.received. ASR-only — entity aliases belong to L2 Entity Registry.
  asr_corrections: {}
  asr_corrections_contextual: {}

tts:
  provider: minimax
  voice: speech-2.8-turbo
  primary_endpoint: api-uw.minimax.io   # WS streaming
  fallback_endpoint: api.minimax.chat   # HTTP one-shot

llm:
  # Tier 2 cloud LLM — stateless calculator over Situation Packet.
  tier2:
    provider: openai
    model: gpt-5.4-mini
    temperature: 0.7
    max_tokens: 4096
  # Tier 0 = regex (in code). Tier 1 = surrogate (post-MVP).

modes:
  default: collaborate
  preset_dir: config/modes

inherent:
  # Browser visual cockpit (L5 second channel). Lands at M4.
  enabled: false
  host: 127.0.0.1
  port: 8007   # legacy web UI is on 8006 — keep separate

attention:
  # Hard gates always apply. Channel scoring is the default routing strategy.
  default_strategy: hard_gates_then_score
  llm_as_judge: false   # reserved for rare borderline cases; off in MVP

memory:
  # Promotion 4-question filter governs what reaches Memory Projection.
  # Concrete params land at M5.
  promotion_enabled: false

logging:
  level: INFO
  format: structured
  destination: ${paths.logs}/jarvis.log
