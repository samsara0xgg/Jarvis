# Tool-cue table for the L3 pre-route (ADR-0008 D12). An utterance that matches
# any entry is routed to the tool-offering full-text path, never to routine
# streaming. Shipped broad and conservative: a false positive only costs
# latency, a false negative would stream a request that needed a tool.
# Patterns are Python regexes, matched case-insensitively with re.search.
- id: zh_imperative_opener
  pattern: "^\\s*(?:帮我|请|给我|把|麻烦|替我|能不能|可不可以|可以帮|帮忙)"
- id: zh_action_verb
  pattern: "打开|关闭|关掉|删除|删掉|移除|发送|发一下|发给|创建|新建|建一个|写入|写一个|写个|修改|改一下|改成|运行|执行|安装|卸载|重启|搜索|搜一下|查一下|查查|查看|看看|看一下|读一下|念一下|提醒我|设置|设一个|安排|记一下|记录|备份|下载|上传|保存|提交|合并|推送|部署|复制|粘贴|截图|翻译一下|总结一下|整理一下"
- id: zh_tool_noun
  pattern: "文件|文件夹|目录|仓库|代码|分支|终端|命令|脚本|网页|网站|链接|邮件|日历|日程|提醒|任务|剪贴板|剪切板|屏幕|截图|应用|程序|窗口|浏览器|项目|代码库|仓"
- id: en_imperative_opener
  pattern: "^\\s*(?:please|can you|could you|would you|help me|go ahead and|let'?s|i need you to|i want you to)\\b"
- id: en_action_verb
  pattern: "\\b(?:open|close|delete|remove|send|create|make|write|edit|modify|change|update|run|execute|install|uninstall|restart|reboot|search|look up|check|read|remind|schedule|set up|set|record|back ?up|download|upload|save|commit|merge|push|deploy|launch|kill|stop|start|copy|paste|summari[sz]e|translate)\\b"
- id: en_tool_noun
  pattern: "\\b(?:files?|folders?|directory|directories|repos?|repository|repositories|code|branch(?:es)?|commits?|terminal|shell|commands?|scripts?|web ?pages?|websites?|urls?|links?|e-?mails?|calendar|reminders?|tasks?|todos?|clipboard|screen|screenshots?|apps?|applications?|windows?|browser|prs?|issues?|projects?)\\b"
