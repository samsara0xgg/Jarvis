<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · 原始玻璃外圈</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color-scheme:dark;background:#0a0c11;color:#eef0f7}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #272b35}strong{font-size:20px;font-weight:500}small{display:block;color:#919caf;font-size:12px;margin-top:6px}nav{display:flex;gap:8px}button,a{font:inherit;color:inherit}button{padding:10px 16px;border:1px solid #343e50;background:transparent;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#27334d;border-color:#5b719b}main{padding:22px 28px}figure{margin:0;height:calc(100svh - 184px);min-height:300px;background:#07090e;display:flex;align-items:center;justify-content:center;border:1px solid #242b36;border-radius:9px}figure a{display:contents}img{max-width:100%;max-height:100%;object-fit:contain}footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:15px;font-size:13px;color:#aeb9cc}footer a{color:#bbcefa;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid #adc4ff;outline-offset:4px}@media(max-width:650px){header{align-items:start;flex-direction:column;padding:20px}main{padding:15px}figure{height:65svh}footer{align-items:start;flex-direction:column;font-size:12px}}
</style></head><body><header><div><strong>Jarvis · 原始玻璃外圈</strong><small>仅第 1、18 张预览 · 其余七张等待确认</small></div><nav aria-label="选择图片"><button id="icon" aria-pressed="true">01 · App 图标</button><button id="poster" aria-pressed="false">18 · 海报</button></nav></header><main><figure><a id="original" href="01-app-icon.png" target="_blank" rel="noopener"><img id="art" src="01-app-icon.png" alt="保留原始烟蓝玻璃外圈的 Jarvis 应用图标"></a></figure><footer><span id="caption">保留原外沿与眼睛比例，轻微润饰内部星云。</span><span><a id="download" href="01-app-icon.png" download>下载原图</a>　<a id="prompt" href="prompts/01-app-icon.txt">提示词</a>　<a href="../../index.html">旧版画廊</a></span></footer></main><script>
const states={icon:{file:"01-app-icon.png",name:"第 1 张 · App 图标",caption:"保留原外沿与眼睛比例，轻微润饰内部星云。"},poster:{file:"18-naming.png",name:"第 18 张 · 品牌海报",caption:"同一颗原始玻璃星核，保留海报排版，弱化银色亮边。"}};function show(key){const s=states[key]||states.icon;for(const k of Object.keys(states))document.getElementById(k).setAttribute("aria-pressed",k===key?"true":"false");const art=document.getElementById("art");art.src=s.file;art.alt=s.name;document.getElementById("original").href=s.file;document.getElementById("download").href=s.file;document.getElementById("prompt").href="prompts/"+s.file.replace(".png",".txt");document.getElementById("caption").textContent=s.caption;document.title=s.name+" · 原始玻璃外圈";history.replaceState(null,"","#"+key)}for(const key of Object.keys(states))document.getElementById(key).onclick=()=>show(key);document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="ArrowLeft")show("icon");if(e.key==="ArrowRight")show("poster")});show(location.hash==="#poster"?"poster":"icon");
</script></body></html>
