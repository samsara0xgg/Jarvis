<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · 发行体验设计</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#090b10;color:#eceef6}
*{box-sizing:border-box}body{margin:0}button,a,select{font:inherit}a{color:inherit;text-decoration:none}button,select{color:inherit;background:#171b25;border:1px solid #343947;border-radius:7px;min-height:40px;padding:8px 13px}button{cursor:pointer}button:hover,a:hover{color:white;background:#202633}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:2px solid #a9baff;outline-offset:4px}
header{height:74px;padding:0 30px;border-bottom:1px solid #262a33;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:25px;letter-spacing:-1px}.sub{color:#8e97ab;font-size:13px;margin-left:18px;letter-spacing:0}.header-actions{display:flex;gap:20px;align-items:center;font-size:13px}
main{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100svh - 74px)}nav{padding:24px 14px;max-height:calc(100svh - 74px);overflow:auto;border-right:1px solid #262a33}.group{font-size:11px;color:#8490a5;letter-spacing:1px;margin:19px 12px 8px}.group:first-child{margin-top:0}.item{display:block;width:100%;border:0;background:none;min-height:37px;text-align:left;padding:8px 12px;color:#a7afbf;font-size:13px}.item span{display:inline-block;min-width:26px;color:#637089;font-size:11px;font-variant-numeric:tabular-nums}.item[aria-current=true]{background:#20293d;color:#f0f3ff}.item[aria-current=true] span{color:#9eb6fa}
.viewer{min-width:0;padding:24px 32px 20px;display:flex;flex-direction:column;gap:14px}.topline{display:flex;justify-content:space-between;align-items:start;gap:20px}.eyebrow{color:#8792a7;font-size:11px;letter-spacing:1.4px;margin-bottom:8px}h1{font-weight:500;font-size:23px;margin:0}.pager{display:flex;gap:8px;align-items:center}.count{color:#8792a7;font-size:12px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.stage{height:calc(100svh - 246px);min-height:340px;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#07090e;border:1px solid #202631;border-radius:8px}.stage.alpha{background:#dce1e9}.stage a{display:flex;justify-content:center;align-items:center;width:100%;height:100%;background:transparent}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.caption{display:flex;justify-content:space-between;gap:22px;align-items:start}.caption p{margin:0;max-width:740px;color:#aeb8cc;font-size:13px;line-height:1.65}.links{display:flex;gap:17px;white-space:nowrap;font-size:12px;color:#a4bbf5;padding-top:3px}.note{color:#647086;font-size:11px;line-height:1.6}select{display:none;width:100%}
@media(max-width:800px){header{padding:16px 20px;height:auto}.sub{display:none}.header-actions{gap:14px;font-size:12px}main{display:block}nav{display:none}.viewer{padding:20px;gap:16px}select{display:block}.stage{height:65svh;min-height:280px}h1{font-size:21px}.caption{display:block}.links{margin-top:12px}.topline{align-items:center}.eyebrow{font-size:10px}}
@media(prefers-reduced-motion:no-preference){button,a{transition:background .15s,color .15s}}
</style></head><body>
<header><div class="brand">Jarvis<span class="sub">发行体验设计 · 18 张独立原图</span></div><div class="header-actions"><a href="README.md">设计说明</a><a href="manifest.json">文件清单</a></div></header>
<main><nav aria-label="设计目录" id="nav"></nav><section class="viewer"><select aria-label="选择设计图" id="select"></select>
<div class="topline"><div><div class="eyebrow" id="group"></div><h1 id="title"></h1></div><div class="pager"><button id="prev" aria-label="上一张">←</button><span class="count" id="count"></span><button id="next" aria-label="下一张">→</button></div></div>
<div class="stage" id="stage"><a id="original" target="_blank" rel="noopener" aria-label="打开完整原图"><img id="art" alt=""></a></div>
<div class="caption"><p id="description"></p><div class="links"><a id="download" download>下载原图</a><a id="prompt" target="_blank" rel="noopener">完整提示词</a></div></div>
<div class="note">每页仅显示一张完整图片。← → 翻页，点击图片打开原图。设计提案 · 内置 ImageGen 生成 · 尚未接入应用。</div>
</section></main>
<script>
const items=[{"id":1,"file":"images/01-app-icon.png","prompt":"prompts/01-app-icon.txt","name":"App 图标","group":"品牌","description":"深空玻璃与两道眼睛。用于 Finder、应用程序、通知及权限弹窗。"},{"id":2,"file":"images/02-menu-template.png","prompt":"prompts/02-menu-template.txt","name":"菜单栏 · 单色模板","group":"品牌","description":"圆形轮廓与镂空眼睛，透明背景。生产时需矢量化并设为系统模板图像。"},{"id":3,"file":"images/03-menu-light.png","prompt":"prompts/03-menu-light.txt","name":"菜单栏 · 浅色","group":"品牌","description":"黑色图标搭配原生浅色菜单。保留隐藏小球操作。"},{"id":4,"file":"images/04-menu-dark.png","prompt":"prompts/04-menu-dark.txt","name":"菜单栏 · 深色","group":"品牌","description":"同一模板由系统反色；菜单与系统外观同步。"},{"id":5,"file":"images/05-installer.png","prompt":"prompts/05-installer.txt","name":"拖入你的 Mac","group":"安装","description":"以星光路径连接 Jarvis 与应用程序文件夹。此图是完整窗口效果稿。"},{"id":6,"file":"images/06-waking.png","prompt":"prompts/06-waking.txt","name":"正在醒来","group":"首次启动","description":"服务就绪之前立即出现可见反馈。未知时长不用虚假百分比。"},{"id":7,"file":"images/07-voice-download.png","prompt":"prompts/07-voice-download.txt","name":"正在准备声音","group":"首次启动","description":"约 240 MB 的首次下载。可继续设置或先用文字；进度数值为示例。"},{"id":8,"file":"images/08-voice-activating.png","prompt":"prompts/08-voice-activating.txt","name":"声音马上就绪","group":"首次启动","description":"下载完成与可以使用分开表达。重连期间暂不可发送。"},{"id":9,"file":"images/09-error-key.png","prompt":"prompts/09-error-key.txt","name":"密钥被拒","group":"对话错误","description":"保留用户消息，指出密钥问题，并提供更换密钥入口。"},{"id":10,"file":"images/10-error-model.png","prompt":"prompts/10-error-model.txt","name":"模型权限不足","group":"对话错误","description":"说清具体是模型访问权限，提供权限检查与更换密钥入口。"},{"id":11,"file":"images/11-error-quota.png","prompt":"prompts/11-error-quota.txt","name":"额度不足","group":"对话错误","description":"提供账户额度入口，不让用户无效地反复重试。"},{"id":12,"file":"images/12-error-network.png","prompt":"prompts/12-error-network.txt","name":"模型服务连不上","group":"对话错误","description":"局部请求失败与整个后台断连分开表达。"},{"id":13,"file":"images/13-error-timeout.png","prompt":"prompts/13-error-timeout.txt","name":"请求超时","group":"对话错误","description":"消息仍留在原处，由用户决定是否再试。"},{"id":14,"file":"images/14-error-rate.png","prompt":"prompts/14-error-rate.txt","name":"请求太频繁","group":"对话错误","description":"平静提示短暂限流，不把它说成额度耗尽。"},{"id":15,"file":"images/15-offline.png","prompt":"prompts/15-offline-revision.txt","name":"暂时连不上 Jarvis","group":"连接状态","description":"暗淡短眼与琥珀断链徽章；保留草稿，发送与麦克风暂停。"},{"id":16,"file":"images/16-reconnecting.png","prompt":"prompts/16-reconnecting.txt","name":"正在重新连接","group":"连接状态","description":"青色恢复光弧，自动重连期间不用倒计时，也不自动重发消息。"},{"id":17,"file":"images/17-about.png","prompt":"prompts/17-about.txt","name":"关于 Jarvis","group":"关于","description":"版本 0.1.0、作者、SenseVoiceSmall 署名与第三方许可证入口。"},{"id":18,"file":"images/18-naming.png","prompt":"prompts/18-naming.txt","name":"Jarvis / Orb","group":"命名","description":"产品对外统一 Jarvis；界面部件为小球 / Orb，保留星核角色身份。"}];
const byId=id=>document.getElementById(id);let current=0;let group="";
for(const item of items){if(item.group!==group){group=item.group;const h=document.createElement("div");h.className="group";h.textContent=group;byId("nav").append(h)}const b=document.createElement("button");b.className="item";b.dataset.index=item.id-1;const n=document.createElement("span");n.textContent=String(item.id).padStart(2,"0");b.append(n,document.createTextNode(item.name));b.onclick=()=>show(item.id-1);byId("nav").append(b);const o=document.createElement("option");o.value=item.id-1;o.textContent=String(item.id).padStart(2,"0")+" · "+item.name;byId("select").append(o)}
function show(index,updateHash=true){current=Math.max(0,Math.min(items.length-1,index));const item=items[current];byId("art").src=item.file;byId("art").alt=item.name+" — "+item.description;byId("title").textContent=item.name;byId("group").textContent=item.group;byId("description").textContent=item.description;byId("count").textContent=String(item.id).padStart(2,"0")+" / 18";byId("original").href=item.file;byId("download").href=item.file;byId("download").download=item.file.split("/").pop();byId("prompt").href=item.prompt;byId("prev").disabled=current===0;byId("next").disabled=current===items.length-1;byId("select").value=current;byId("stage").classList.toggle("alpha",item.id===2);document.querySelectorAll(".item").forEach((el,i)=>el.setAttribute("aria-current",i===current?"true":"false"));if(updateHash)history.replaceState(null,"","#"+item.id);document.title=item.name+" · Jarvis"}
byId("prev").onclick=()=>show(current-1);byId("next").onclick=()=>show(current+1);byId("select").onchange=e=>show(Number(e.target.value));document.addEventListener("keydown",e=>{if(["SELECT","INPUT","TEXTAREA"].includes(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="ArrowLeft"){e.preventDefault();show(current-1)}if(e.key==="ArrowRight"){e.preventDefault();show(current+1)}});window.addEventListener("hashchange",()=>show((Number(location.hash.slice(1))||1)-1,false));show((Number(location.hash.slice(1))||1)-1,false);
</script></body></html>
